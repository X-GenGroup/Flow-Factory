# Environment Configuration
launcher: "accelerate"  # Options: accelerate
# Use `config/accelerate_configs/fsdp2.yaml` to shard the model for lower memory usage.
config_file: config/deepspeed/deepspeed_zero2.yaml # Switch to config/deepspeed/deepspeed_zero2.yaml if you have enough GPU memory.
num_processes: 8  # Number of processes to launch (overrides config file)
main_process_port: 29500
mixed_precision: "bf16"  # Options: no, fp16, bf16

# Data Configuration
data:
  datasets:
    - name: default  # Unique identifier (used in metrics, caching, reward routing)
      dataset_dir: "dataset/sharegpt4o_image_mini"  # Folder with train.jsonl / test.jsonl
      train:  # Training participation config
        weight: 1  # Mixing weight (integer); ratio with other sources determines batch allocation
        max_dataset_size: 128  # Cap on number of training samples for this source
      eval: {}  # Eval participation (inherits shared `eval:` section settings)
  preprocessing_batch_size: 8  # Batch size for preprocessing
  dataloader_num_workers: 16  # Number of workers for DataLoader
  force_reprocess: true  # Force reprocessing of the dataset
  cache_dir: "~/.cache/flow_factory/datasets" # Cache directory for preprocessed datasets
  sampler_type: "auto"  # Options: auto, distributed_k_repeat, group_contiguous
  sampler_subgroup_size: null  # Options: null or a positive world-size divisor; only for subgroup_tile.

# Model Configuration
model:
  finetune_type: 'lora' # Options: full, lora
  lora_rank : 64
  lora_alpha : 128
  target_modules: "default" # Options: all, default, or list of module names like ["to_k", "to_q", "to_v", "to_out.0"]
  model_name_or_path: "Qwen/Qwen-Image-Edit-2509"  # Qwen/Qwen-Image-Edit-2509 or Qwen/Qwen-Image-Edit-2511
  model_type: "qwen-image-edit-plus"
  resume_path: null # Local path or HF repo id (e.g. 'owner/repo[/subdir][@rev]') for previous checkpoint/lora adapter
  resume_type: null # Options: lora, full, state. Null to auto-detect based on `finetune_type`
# Optional acceleration plugins (off by default). Applied in list order.
# See guidance/acceleration.md. GRPO is coupled, so lossy rollout caching is unsafe;
# persistent `shared` accelerators run in both rollout and training.
# acceleration:
#   shared:                          # persistent stage='both'; applied in list order
#     - name: attention_backend      # set the attention backend first...
#       params: { backend: _flash_3_varlen_hub }
#     - name: torch_compile          # ...so the compiled graph captures it
#       params: { mode: auto }   # auto (default: regional) | regional | full

log:
  run_name: null  # Run name (auto: {model_type}_{finetune_type}_{trainer_type}_{timestamp})
  project: "Flow-Factory"  # Project name for logging
  logging_backend: "wandb"  # Options: wandb, swanlab, tensorboard, none
  save_dir: "saves/"  # Directory to save model checkpoints and logs
  save_freq: 20  # Save frequency in epochs (0 to disable)
  save_model_only: true  # Save only the model weights (not optimizer, scheduler, etc.)

# Training Configuration
train:
  # Trainer settings
  trainer_type: 'grpo' # Options: 'grpo', 'nft', 'awm'
  reward_optimization_overlap: false  # Off by default; supported runtime-reward trainers only
  reward_optimization_overlap_mode: "ready"  # Options: ordered, ready
  reward_optimization_overlap_poll_interval: 0.05  # Seconds between readiness polls
  advantage_aggregation: 'gdpo' # Options: 'sum', 'gdpo'
  # Clipping
  clip_range: 1.0e-4  # PPO/GRPO clipping range
  adv_clip_range: 5.0  # Advantage clipping range
  # KL div
  kl_type: 'v-based' # Options: 'x-based', 'v-based'
  kl_beta: 0 # KL divergence coefficient. Set ~1e-2 for 'x-based' and ~1e-3 for 'v-based'.
  ref_param_device: 'cuda' # Options: cpu, cuda

  # Sampling settings
  resolution: 384  # Can be int or [height, width]
  auto_resize: true # Enable auto-resize to fit the condition images' aspect ratio during inference
  condition_image_size: [384, 384]  # Max condition image resolution, int or [height, width]
  num_inference_steps: 10  # Number of timesteps
  guidance_scale: 4  # Guidance scale for sampling
  
  # Batch and sampling
  per_device_batch_size: 1  # Qwen-Image-Edit-Plus accepts varying length of multi-image as condition, so the batch_size will always fallback to 1.
  group_size: 16  # Group size for GRPO sampling
  global_std: false  # Use global std for advantage normalization
  unique_sample_num_per_epoch: 48  # Unique samples per group
  gradient_step_per_epoch: 2  # Gradient steps per epoch
  gradient_accumulation_steps: auto  # Options: auto, or positive integer. When set, `gradient_step_per_epoch` is ignored.
  
  # Optimization

  # EMA
  ema_decay: 0.9  # EMA decay rate (0 to disable)
  ema_update_interval: 4  # EMA update interval (in epochs)
  ema_device: "cuda"  # Device to store EMA model (options: cpu, cuda)

  # Gradient checkpointing
  enable_gradient_checkpointing: true  # Enable gradient checkpointing to save memory with extra compute
  # offload_samples_to_cpu: CPU-offload sample tensor fields between sample() and optimize() to reduce GPU peak memory.
  # Pros (true): saves N x per_batch_size GPU memory in sample()/optimize() (often GB-scale); no correctness or convergence impact.
  # Cons (true): adds ~100ms/epoch H2D in reward path; tiny per-batch H2D in optimize (<5ms each).
  # Recommended (true) for higher resolutions, larger batch sizes, or any sample()/optimize() OOM. Default false works for current example settings.
  offload_samples_to_cpu: false

  # Seed
  seed: 42

# Scheduler Configuration
scheduler:
  dynamics_type: "Flow-SDE"  # Options: Flow-SDE, Dance-SDE, CPS, ODE
  noise_level: 1.0  # Noise level for sampling
  num_sde_steps: 1  # Number of noise steps
  sde_steps: [1, 2, 3]  # Custom noise window, noise steps are randomly selected from this list during training
  seed: 42  # Scheduler seed (for noise step selection)

# Evaluation settings
eval:
  resolution: 1024  # Evaluation resolution
  condition_image_size: [1024, 1024]  # Max condition image resolution, int or [height, width]
  auto_resize: true # Enable auto-resize to fit the condition images' aspect ratio during inference
  guidance_scale: 4  # Guidance scale for sampling
  num_inference_steps: 40  # Number of eval timesteps
  per_device_batch_size: 1  # Eval batch size
  eval_freq: 20  # Eval frequency in epochs (0 to disable)
  seed: 42  # Eval seed

# Reward Model Configuration
rewards:
  name: "pick_score"
  reward_model: "PickScore"
  batch_size: 16
  device: "cuda"
  dtype: bfloat16

# Optional Evaluation Reward Models
# eval_rewards:
#   - name: "text_alignment"
#     reward_model: "CLIP"
#     batch_size: 16
#     dtype: bfloat16
#     device: "cuda"


# Optimizer Configuration
# One entry per trainable variant. A single-policy run has exactly one.
optimizers:
  - name: default
    learning_rate: 3.0e-4  # Initial learning rate
    weight_decay: 1.0e-4  # AdamW weight decay
    betas: [0.9, 0.999]  # AdamW betas
    eps: 1.0e-8  # AdamW epsilon
    max_grad_norm: 1.0  # Max gradient norm for clipping

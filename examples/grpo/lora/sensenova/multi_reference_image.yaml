# SenseNova-U1 1.0/1.5 ordered multi-reference I2I with GRPO.
# Prepare the dataset first:
#   python dataset/multi_ref_image/prepare.py

# Environment Configuration
launcher: "accelerate"
config_file: config/accelerate_configs/multi_gpu.yaml
num_processes: 8
main_process_port: 29500
mixed_precision: "bf16"

log:
  run_name: null
  project: "Flow-Factory"
  logging_backend: "wandb"
  save_dir: "saves"
  save_freq: 20
  save_model_only: true

# Multi-reference I2I dataset. Each sample contains 2-3 ordered image paths.
data:
  datasets:
    - name: multi_reference_image
      dataset_dir: "dataset/multi_ref_image"
      train:
        weight: 1
        max_dataset_size: 1024
      eval: {}
  preprocessing_batch_size: 8
  dataloader_num_workers: 16
  force_reprocess: true
  cache_dir: "~/.cache/flow_factory/datasets"

model:
  finetune_type: "lora"
  lora_rank: 64
  lora_alpha: 128
  target_modules: "default"
  model_name_or_path: "sensenova/SenseNova-U1.5-8B-MoT-SFT"
  model_type: "sensenova"
  resume_path: null
  resume_type: null

train:
  trainer_type: "grpo"
  reward_optimization_overlap: false  # Off by default; supported runtime-reward trainers only
  reward_optimization_overlap_mode: "ordered"  # Options: ordered, ready
  reward_optimization_overlap_poll_interval: 0.05  # Seconds between readiness polls
  advantage_aggregation: "gdpo"
  clip_range: 1.0e-4
  adv_clip_range: 5.0
  kl_type: "v-based"
  kl_beta: 0
  ref_param_device: "cuda"

  resolution: 512
  num_inference_steps: 10
  # Text and image CFG for ordered multi-reference generation.
  guidance_scale: 1.0
  image_guidance_scale: 1.0
  cfg_norm: none
  cfg_interval: [0.0, 1.0]
  timestep_shift: 3.0

  # SenseNova handles each sample with an independent prefix cache, including
  # variable-size and variable-count condition images.
  per_device_batch_size: 2
  shuffle_samples: true
  group_size: 16
  global_std: true
  unique_sample_num_per_epoch: 48
  gradient_step_per_epoch: 2

  ema_decay: 0.9
  ema_update_interval: 4
  ema_device: "cuda"
  enable_gradient_checkpointing: false
  seed: 42

scheduler:
  dynamics_type: "CPS"
  shift: 1.0
  noise_level: 0.8
  num_sde_steps: 1
  sde_steps: [1, 2, 3]
  seed: 42

eval:
  resolution: 512
  per_device_batch_size: 2
  guidance_scale: 3.0
  image_guidance_scale: 1.5
  num_inference_steps: 50
  eval_freq: 20
  seed: 42
  cfg_norm: global
  cfg_interval: [0.0, 1.0]
  timestep_shift: 3.0

rewards:
  - name: "pickscore"
    reward_model: "PickScore"
    weight: 1.0
    batch_size: 16
    device: "cuda"
    dtype: bfloat16
    applicable_datasets: [multi_reference_image]

eval_rewards:
  - name: "pickscore"
    reward_model: "PickScore"
    weight: 1.0
    batch_size: 32
    device: "cuda"
    dtype: bfloat16
    applicable_datasets: [multi_reference_image]

optimizers:
  - name: default
    learning_rate: 1.0e-4
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]
    eps: 1.0e-8
    max_grad_norm: 1.0

# Additive ART example; replace model/dataset locations before training.
# DDP2: U4 * K4 / (D2 * B1) = 8 batches/rank; four selected steps => GAS16/update.
launcher: accelerate
config_file: config/validation/backends/ddp.yaml
num_processes: 2
mixed_precision: bf16
model:
  model_type: sd3-5
  model_name_or_path: stabilityai/stable-diffusion-3.5-medium
  finetune_type: lora
  lora_rank: 16
  lora_alpha: 32
  target_modules: default
  trainable_parameters_dtype: float32
data:
  datasets:
    - name: prompts
      dataset_dir: dataset/pickscore
      train: {weight: 1}
  sampler_type: rank_local
  preprocessing_batch_size: 1
  dataloader_num_workers: 0
train:
  trainer_type: art
  max_epochs: 100
  resolution: 512
  num_inference_steps: 20
  guidance_scale: 1.0
  group_size: 4
  unique_sample_num_per_epoch: 4
  per_device_batch_size: 1
  gradient_step_per_epoch: 2
  gradient_accumulation_steps: auto
  num_inner_epochs: 1
  enable_gradient_checkpointing: true
  shuffle_samples: true
  latent_storage_dtype: float32
  global_std: false
  advantage_aggregation: gdpo
  art_guidance_scale: 1.0
  art_kl_threshold: 1.0e-5
  art_reference_noise_level: 0.8
  ema_decay: 0.0
  reward_optimization_overlap: false
  seed: 42
scheduler:
  dynamics_type: ODE
  replay_steps: [0, 5, 10, 15]
rewards:
  - name: pick_score
    reward_model: PickScore
    device: cuda
    dtype: bfloat16
    batch_size: 1
optimizers:
  - name: default
    learning_rate: 1.0e-4
    weight_decay: 0.0
    max_grad_norm: 1.0
log:
  logging_backend: none
  save_dir: saves/art
  save_freq: 10
  save_model_only: false
eval:
  eval_freq: 0

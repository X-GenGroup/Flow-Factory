# BAGEL four-step trajectory distribution matching.
# BAGEL uses NaViT packing, so rollout and replay batches must keep identical composition.

launcher: "accelerate"
config_file: config/accelerate_configs/multi_gpu.yaml
num_processes: 8
main_process_port: 29500
mixed_precision: "bf16"

data:
  datasets:
    - name: pickscore
      dataset_dir: "dataset/pickscore"
      train:
        weight: 1
        max_dataset_size: 1024
      eval: {}
  preprocessing_batch_size: 8
  dataloader_num_workers: 16
  force_reprocess: false
  cache_dir: "~/.cache/flow_factory/datasets"
  sampler_type: "auto"

model:
  model_type: "bagel"
  model_name_or_path: "ByteDance-Seed/BAGEL-7B-MoT"
  finetune_type: "lora"
  lora_rank: 64
  lora_alpha: 128
  target_components: "transformer"
  target_modules: "default"
  frozen_parameters_dtype: null
  trainable_parameters_dtype: "bf16"
  resume_path: null
  resume_type: null

log:
  run_name: null
  project: "Flow-Factory-TDM"
  logging_backend: "wandb"
  save_dir: "saves/"
  save_freq: 20
  save_model_only: true

train:
  trainer_type: "tdm"
  max_epochs: 10000
  resolution: 512
  num_inference_steps: 4
  guidance_scale: 1.0
  real_guidance_scale: 4.0
  cfg_text_scale: 1.0
  cfg_img_scale: 1.0
  cfg_interval: [0.0, 1.0]
  cfg_renorm_min: 0.0
  cfg_renorm_type: "global"

  per_device_batch_size: 2
  group_size: 1
  unique_sample_num_per_epoch: 128
  gradient_step_per_epoch: 1
  gradient_accumulation_steps: "auto"
  shuffle_samples: false

  ttur_fake_updates: 1
  use_huber: true
  huber_c: 0.001
  tdm_snr_gamma: 5.0
  tdm_importance_clip: 20.0

  enable_gradient_checkpointing: true
  offload_samples_to_cpu: true
  latent_storage_dtype: "fp16"
  ema_decay: 0
  ema_update_interval: 1
  ema_device: "cuda"
  replay_rtol: 0
  replay_atol: 0
  seed: 42

scheduler:
  dynamics_type: "ODE"
  shift: 3.0

eval:
  resolution: 512
  per_device_batch_size: 2
  guidance_scale: 1.0
  num_inference_steps: 4
  eval_freq: 20
  seed: 42
  cfg_text_scale: 1.0
  cfg_img_scale: 1.0
  cfg_interval: [0.0, 1.0]
  cfg_renorm_min: 0.0
  cfg_renorm_type: "global"

eval_rewards:
  - name: "pickscore"
    reward_model: "PickScore"
    weight: 1.0
    batch_size: 16
    device: "cuda"
    dtype: bfloat16
    applicable_datasets: [pickscore]

optimizers:
  - name: "generator"
    learning_rate: 1.0e-5
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]
    eps: 1.0e-8
    max_grad_norm: 1.0
  - name: "fake"
    learning_rate: 1.0e-5
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]
    eps: 1.0e-8
    max_grad_norm: 1.0

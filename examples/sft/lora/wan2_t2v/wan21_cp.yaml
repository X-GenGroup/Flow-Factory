# Experimental Wan2.1 SFT with native Ulysses CP. See guidance/context_parallel.md.
# Prepare a V2 demonstration dataset; 49 frames at 10 FPS need 4.8 seconds of source media.
launcher: accelerate
config_file: config/accelerate_configs/fsdp2.yaml
num_processes: 4
num_machines: 1
mixed_precision: bf16
parallelism:
  cp_size: 2
  # dp_shard_size is inferred from the launched process count.
model:
  model_name_or_path: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
  model_type: wan2_t2v
  compute_precision_policy: cross_attention_fp32_v1
  finetune_type: lora
  lora_rank: 32
  lora_alpha: 64
  target_components: [transformer]
  target_modules: default
data:
  datasets:
    - name: wan21_sft
      dataset_dir: dataset/wan21_sft
      train: {weight: 1}
  enable_preprocess: true
  preprocessing_batch_size: 1
  dataloader_num_workers: 2
  cache_dir: ~/.cache/flow_factory/datasets
train:
  trainer_type: sft
  max_epochs: 5
  resolution: [480, 832]
  num_frames: 49
  frame_rate: 10.0
  guidance_scale: 1.0
  per_device_batch_size: 1
  gradient_accumulation_steps: 2
  enable_gradient_checkpointing: true
  num_train_timesteps: 1
  ema_decay: 0.0
  seed: 42
scheduler:
  dynamics_type: ODE
acceleration:
  shared:
    - name: attention_backend
      params: {backend: native}
log:
  run_name: wan21-cp-sft
  logging_backend: none
  save_dir: saves/
  save_freq: 1
  save_model_only: true
eval:
  eval_freq: 0
optimizers:
  - name: default
    optimizer: adamw
    learning_rate: 1.0e-5
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]
    eps: 1.0e-8
    max_grad_norm: 1.0

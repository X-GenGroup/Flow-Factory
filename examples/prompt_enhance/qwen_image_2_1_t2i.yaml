# Expand short text-to-image prompts into detailed Qwen-Image-2.1 prompts with the official T2I rewriter.
# Launch: ff-prompt-enhance examples/prompt_enhance/qwen_image_2_1_t2i.yaml
# Train on the result by pointing a Qwen-Image-2.1 config's dataset_dir at `output_dir`.

num_processes: 8  # Data-parallel enhancer replicas; each rank enhances a disjoint row shard

enhancer: qwen-image-2.1-t2i
model_name_or_path: "Qwen/Qwen-Image-2.1-PE-T2I"
input_dir: "dataset/pickscore"  # Prompt-only rows; a row with reference images fails
output_dir: "dataset/pickscore_qwen_image_2_1_pe"
splits: null  # null = every train/test split present
num_variants: 1  # Enhanced prompts per source prompt; each one becomes its own training row
batch_size: 8
seed: 42
dtype: bfloat16
system_prompt: null  # null = the checkpoint's system_prompt.txt
generation: {}  # {} = the official T2I profile: thinking, then sampling at temperature 1.0 with presence_penalty 1.5

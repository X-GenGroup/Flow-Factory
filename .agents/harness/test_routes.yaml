version: 2

# Profiles select obligations, never a fixed QA level, world size, or Cartesian matrix.

profiles:
  R0:
    evidence: [read-only scope]
  R1:
    evidence: [changed-file formatting, focused unit tests, registry or config parsing when touched]
  R2:
    evidence: [R1 evidence, affected integration path, working-analogue comparison]
  R3:
    evidence: [R2 evidence, affected state or distributed boundaries, validated selected plan and results]
  R4:
    evidence:
      - enumerate all affected owners and contracts, including reached registry implementations
      - cover every required obligation with a validated selected plan and exact-commit results
      - choose QA levels and the smallest valid topology independently of risk

facets:
  scope:
    tests: []
  harness:
    commands:
      - python3 scripts/validate_agent_harness.py
      - make quality
      - make consistency
      - make test-cpu
  observability:
    tests:
      - syntax and focused logging assertions; review handlers and log consumers when relevant
  geometry:
    tests:
      - tests/contracts/test_topology.py
      - tests/distributed/test_topology_scopes.py
      - tests/distributed/test_data_parallel_geometry.py
      - tests/distributed/test_crd_logical_gather.py
      - tests/distributed/test_logical_subgroups.py
      - tests/distributed/test_context_parallel_subgroups.py
      - tests/trainers/test_evaluation_geometry.py
      - tests/distributed/test_evaluation_parallel.py
      - tests/distributed/test_context_parallel_evaluation.py
      - logical sample identity, group membership, loss scaling and affected mesh interactions
  docs_only:
    commands:
      - python3 scripts/audit_docstrings.py
    tests:
      - per-file token proof in the scope report; inspect any unverified path separately
      - tests/docs/test_docstring_hygiene.py
      - every test that reads docstrings (rg -n "getdoc|__doc__" tests)
  objective:
    tests:
      - tests/distributed/test_tdm_r1_objective_reference.py
      - tests/trainers/test_tdm_r1_cp_contracts.py
      - tests/trainers/test_tdm_r1_overlap_abort.py
      - tests/trainers/test_opd_cp_contracts.py
      - tests/distributed/test_opd_objective_reference.py
      - tests/distributed/test_tdm_objective_reference.py
      - numerical oracle and limiting cases
      - tests/distributed/test_crd_objective_reference.py
      - tests/trainers/test_crd_pass_state.py
      - gradient direction and finite loss
      - two acquisition cycles with a lightweight runtime
  time_sampling:
    tests:
      - tests/test_noise_schedule.py
      - timestep coverage for every affected time_sampling_strategy
  execution:
    tests:
      - tests/contracts/test_execution_contract.py
      - tests/hparams/test_execution_contracts.py
      - tests/trainers/test_execution_kernel.py
  feedback:
    tests:
      - tests/rewards/test_reward_processor_reconstruction.py
      - tests/trainers/test_collective_packing.py
  reward:
    tests:
      - direct full and tail batch dispatch
      - applicability, output order, shape, and finiteness
  prompt_enhance:
    tests:
      - tests/prompt_enhance
  overlap:
    tests:
      - tests/rewards/test_reward_optimization_overlap.py
      - tests/trainers/test_trainer_reward_optimization_overlap.py
  sampler:
    tests:
      - tests/data_utils/test_group_distributed_sampler.py
      - tests/data_utils/test_multi_source.py
  data_schema:
    tests:
      - tests/data_utils/test_schema.py
      - tests/data_utils/test_offline_dataset.py
  trajectory:
    tests:
      - tests/models/trajectory
      - tests/samples/test_structured_trajectory.py
  model_adapter:
    tests:
      - tests/distributed/test_qwen_edit_context_parallel_contracts.py
      - tests/distributed/test_wan_i2v_context_parallel_contracts.py
      - tests/models/test_lora_parameter_loading.py
      - tests/distributed/test_lora_parameter_placement.py
      - tests/models/test_all_model_loaders.py
      - adapter-specific contract test
  model_runtime:
    tests:
      - tests/distributed/test_qwen_edit_context_parallel.py
      - tests/distributed/test_wan_i2v_context_parallel.py
      - tests/distributed/test_opd_context_parallel.py
      - tests/distributed/test_tdm_context_parallel.py
      - tests/models/test_compute_precision.py
      - tests/trainers/test_context_parallel_config.py
      - tests/distributed/test_context_parallel_training.py
      - tests/distributed/test_context_parallel_state.py
      - tests/distributed/test_context_parallel_online.py
      - tests/distributed/test_model_preparation.py
      - tests/models/runtime/test_component_runtime.py
      - tests/loading/test_coordinator.py
  parity:
    tests:
      - rollout-forward numerical parity for every claimed mode
  roles:
    tests:
      - tests/trainers/test_role_optimization.py
      - tests/trainers/test_multirole_production_paths.py
  optimizer:
    tests:
      - tests/hparams/test_optimizer_args.py
      - tests/trainers/test_distributed_plan_validation.py
  runtime_state:
    tests:
      - tests/trainers/test_sharded_runtime_state.py
      - tests/trainers/test_runtime_identity.py
      - tests/trainers/test_runtime_checkpoint_integration.py
      - tests/distributed/test_context_parallel_state.py
  checkpoint:
    tests:
      - model-only round trip
      - exact-state interrupted/resumed equivalence
  distributed:
    tests:
      - tests/distributed/test_tdm_r1_logical_identity.py
      - tests/distributed/test_tdm_r1_context_parallel.py
      - affected backend semantics on the smallest valid mesh; no automatic unrelated backend sweep
      - identical collective order and synchronized failures
  loading:
    tests:
      - tests/loading
      - early rejection before heavyweight allocation
  acceleration:
    tests:
      - tests/acceleration
      - train-inference parity under the declared stage and safety

  - name: proven console logging edit in a shared trainer
    intent: develop
    paths:
      src/flow_factory/trainers/abc.py: 'logger.info("Training started")'
    sources:
      src/flow_factory/trainers/abc.py:
        before: |
          import logging
          logger = logging.getLogger(__name__)
          def start():
              train()
        after: |
          import logging
          logger = logging.getLogger(__name__)
          def start():
              logger.info("Training started")
              train()
    expected_profile: R1
    expected_facets: [observability]

  - name: logging argument side effects are not observational
    intent: develop
    paths:
      src/flow_factory/trainers/abc.py: 'logger.info("Training started: %s", update())'
    sources:
      src/flow_factory/trainers/abc.py:
        before: |
          import logging
          logger = logging.getLogger(__name__)
          def start():
              train()
        after: |
          import logging
          logger = logging.getLogger(__name__)
          def start():
              logger.info("Training started: %s", update())
              train()
    expected_profile: R4
    expected_facets: [execution]


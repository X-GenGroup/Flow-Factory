  - name: objective-only algorithm
    intent: new-algorithm
    paths:
      src/flow_factory/trainers/rl/my_algorithm.py: |
        class MyAlgorithmTrainer(BaseTrainer):
            def optimize(self, samples):
                return objective(samples)
    expected_profile: R1
    expected_facets: [objective]

  - name: strict algorithm extension
    intent: new-algorithm
    paths:
      src/flow_factory/trainers/rl/my_guard.py: |
        class MyGuardTrainer(GRPOTrainer):
            def optimize(self, samples):
                return super().optimize(samples)
    expected_profile: R2
    expected_facets: [objective, runtime_state]

  - name: algorithm lifecycle override
    intent: new-algorithm
    paths:
      src/flow_factory/trainers/distillation/my_algorithm.py: |
        def _run_training_step(self):
            return self.optimize(self.sample())
    expected_profile: R3
    expected_facets: [execution, runtime_state]

  - name: shared trainer lifecycle
    intent: develop
    paths:
      src/flow_factory/trainers/abc.py: |
        def start(self):
            self._run_training_step()
    expected_profile: R4
    expected_facets: [execution, feedback, checkpoint]


version: 2

profiles:
  R0:
    rank: 0
    description: Read-only inspection.
  R1:
    rank: 1
    description: Leaf extension or objective-only change.
  R2:
    rank: 2
    description: Component-local composition change.
  R3:
    rank: 3
    description: State, schema, role, collective, resume, or backend change.
  R4:
    rank: 4
    description: Shared framework execution or dataflow change.

intents:
  inspect: R0
  review: R0
  docs: R1
  debug: R1
  develop: R1
  new-model: R1
  new-reward: R1
  new-algorithm: R1
  new-accelerator: R2
  harness: R2

docs_only_rule:
  profile: R1
  facets: [docs_only]
  reason: Comment and docstring edits leave the Python token stream identical to the base.

logging_only_rule:
  profile: R1
  facets: [observability]
  reason: Complete sources differ only in literal module-console logging statements.

path_rules:
  - glob: src/flow_factory/models/compute_precision.py
    profile: R4
    facets: [model_runtime, parity, runtime_state]
    reason: Model-declared operation precision controls shared forward/autograd and resume semantics.
  - glob: src/flow_factory/models/context_parallel.py
    profile: R4
    facets: [model_runtime, distributed, geometry, parity]
    reason: Context parallel preparation owns attention layout and the output-gradient boundary.
  - glob: src/flow_factory/trainers/common/evaluation.py
    profile: R4
    facets: [execution, distributed, geometry, feedback, runtime_state]
    reason: Evaluation owns real dataset rows, model-peer scoring and logical-DP statistics between training cycles.
  - glob: src/flow_factory/trainers/common/context_parallel.py
    profile: R4
    facets: [model_runtime, distributed, execution, objective, runtime_state]
    reason: Context parallel gates bind full-output loss and exact-state boundaries to concrete trainer capabilities.
  - glob: src/flow_factory/utils/tensor_state.py
    profile: R3
    facets:
    - runtime_state
    - distributed
    reason: Tensor-state layout validation controls fixed-topology checkpoint compatibility.
  - glob: src/flow_factory/trainers/common/model_preparation.py
    profile: R4
    facets:
    - model_runtime
    - distributed
    - roles
    reason: Shared preparation owns parallel transforms, optimizer rebinding and backend routes.
  - glob: "**"
    profile: R1
    facets: [scope]
    reason: Any repository mutation requires focused validation.
    report: false
  - glob: ".agents/**"
    profile: R2
    facets: [harness]
    reason: Harness changes affect agent routing and validation behavior.
  - glob: "AGENTS.md"
    profile: R2
    facets: [harness]
    reason: The canonical repository policy controls every agent task.
  - glob: "CLAUDE.md"
    profile: R2
    facets: [harness]
    reason: The Claude adapter must remain a pointer to canonical policy.
  - glob: "src/flow_factory/**/AGENTS.md"
    profile: R2
    facets: [harness]
    reason: Nested scope routers change path-local agent behavior.
  - glob: ".cursor/**"
    profile: R2
    facets: [harness]
    reason: Tool adapters must remain aligned with canonical policy.
  - glob: ".claude/**"
    profile: R2
    facets: [harness]
    reason: Tool permissions and adapters affect mutation behavior.
  - glob: "scripts/agent_*.py"
    profile: R2
    facets: [harness]
    reason: Scope automation controls risk and evidence selection.
  - glob: "scripts/validation_*.py"
    profile: R2
    facets: [harness]
    reason: Validation catalogs, selection and evidence transport define required proof.
  - glob: "tests/scripts/test_validation_*.py"
    profile: R2
    facets: [harness]
    reason: Planner and catalog regressions define coverage and result acceptance.
  - glob: "scripts/validate_agent_harness.py"
    profile: R2
    facets: [harness]
    reason: Harness validation enforces repository agent policy.
  - glob: "scripts/validate_*plan.py"
    profile: R2
    facets: [harness]
    reason: Selected-plan validation defines evidence acceptance.
  - glob: "scripts/validate_gpu_campaign.py"
    profile: R2
    facets: [harness]
    reason: The optional historical campaign reader defines evidence acceptance.
  - glob: "config/validation/**"
    profile: R2
    facets: [harness]
    reason: Validation examples define the selected-plan contract.
  - glob: "tests/scripts/test_agent_*.py"
    profile: R2
    facets: [harness]
    reason: Scope collection and routing regressions define policy behavior.
  - glob: "tests/scripts/test_validate_*.py"
    profile: R2
    facets: [harness]
    reason: Evidence validator regressions define policy behavior.
  - glob: "tests/docs/test_agent_harness.py"
    profile: R2
    facets: [harness]
    reason: Harness regression tests define routing and validation expectations.
  - glob: "scripts/query_fix_patterns.py"
    profile: R2
    facets: [harness]
    reason: Historical retrieval is part of the debug harness.
  - glob: "scripts/check_docs_only_diff.py"
    profile: R2
    facets: [harness]
    reason: Docs-only verification decides when path and content escalation is skipped.
  - glob: "scripts/audit_docstrings.py"
    profile: R2
    facets: [harness]
    reason: The docstring audit enforces repository documentation policy.
  - glob: "scripts/check_repository.py"
    profile: R2
    facets: [harness]
    reason: Repository consistency selects and enforces static contracts.
  - glob: "scripts/repo_checks/**"
    profile: R2
    facets: [harness]
    reason: Static validators define accepted registry, reference and dependency shapes.
  - glob: "scripts/quality.py"
    profile: R2
    facets: [harness]
    reason: Quality snapshots and hook dispatch define which source is validated.
  - glob: ".pre-commit-config.yaml"
    profile: R2
    facets: [harness]
    reason: Hook configuration controls contributor-side quality enforcement.
  - glob: ".github/workflows/quality.yml"
    profile: R2
    facets: [harness]
    reason: CPU CI controls server-side quality enforcement.
  - glob: "requirements/quality.txt"
    profile: R2
    facets: [harness]
    reason: Pinned quality tools must agree across hooks and CI.
  - glob: "requirements/actionlint.json"
    profile: R2
    facets: [harness]
    reason: The pinned workflow checker is part of the quality tool environment.
  - glob: "Makefile"
    profile: R2
    facets: [harness]
    reason: Shared contributor and CI commands define validation entry points.
  - glob: "tests/tools/test_quality.py"
    profile: R2
    facets: [harness]
    reason: Git and hook regressions define source and staging guarantees.
  - glob: "tests/tools/test_repository_consistency.py"
    profile: R2
    facets: [harness]
    reason: Consistency regressions define static contract enforcement.
  - glob: "tests/docs/test_docstring_hygiene.py"
    profile: R2
    facets: [harness]
    reason: Docstring hygiene tests define the enforced documentation checks.
  - glob: "src/flow_factory/trainers/**/*.py"
    profile: R1
    facets: [objective]
    reason: Algorithm-local trainers start in the objective-only fast path.
  - glob: "src/flow_factory/models/**/*.py"
    profile: R1
    facets: [model_adapter]
    reason: Model-family changes default to the adapter fast path.
  - glob: "src/flow_factory/rewards/**/*.py"
    profile: R1
    facets: [reward]
    reason: Reward implementations default to focused dispatch tests.
  - glob: "src/flow_factory/acceleration/**/*.py"
    profile: R2
    facets: [acceleration, parity]
    reason: Acceleration plugins require stage, safety, ordering, and parity evidence.
  - glob: "src/flow_factory/prompt_enhance/**/*.py"
    profile: R1
    facets: [prompt_enhance]
    reason: Offline prompt enhancement writes a new dataset and never runs inside training.
  - glob: "src/flow_factory/data_utils/**/*.py"
    profile: R3
    facets: [data_schema]
    reason: Data and cache changes affect persistent typed boundaries.
  - glob: "src/flow_factory/utils/noise_schedule.py"
    profile: R2
    facets: [objective, time_sampling]
    reason: Shared time sampling sets the training timestep distribution of several objectives.
  - glob: "src/flow_factory/utils/dist.py"
    profile: R3
    facets: [distributed, geometry]
    reason: Logical data ranks and parallel groups affect sample and batch geometry.
  - glob: "src/flow_factory/hparams/parallelism_args.py"
    profile: R3
    facets: [distributed, geometry]
    reason: Parallelism configuration defines the supported mesh and batch geometry.
  - glob: "src/flow_factory/contracts/topology.py"
    profile: R3
    facets: [distributed, geometry]
    reason: Topology dimensions and group membership define physical and logical rank ownership.
  - glob: "src/flow_factory/models/tensor_parallel.py"
    profile: R4
    facets: [distributed, geometry, model_runtime, parity]
    reason: Shared tensor layouts and gradient reductions reach every TP adapter plan.
  - glob: "src/flow_factory/trainers/abc.py"
    profile: R4
    facets: [execution, feedback, checkpoint]
    reason: BaseTrainer owns the shared training lifecycle.
  - glob: "src/flow_factory/trainers/execution.py"
    profile: R4
    facets: [execution]
    reason: Acquisition drivers define shared cycle semantics.
  - glob: "src/flow_factory/trainers/role_optimization.py"
    profile: R4
    facets: [roles, optimizer]
    reason: Role optimization is shared multi-role infrastructure.
  - glob: "src/flow_factory/trainers/multirole/**"
    profile: R4
    facets: [roles, checkpoint, distributed]
    reason: Multi-role backend and checkpoint code is shared infrastructure.
  - glob: "src/flow_factory/contracts/execution.py"
    profile: R4
    facets: [execution]
    reason: Execution contracts select acquisition and feedback semantics.
  - glob: "src/flow_factory/contracts/feedback.py"
    profile: R4
    facets: [feedback, distributed]
    reason: Feedback contracts define shared grouping and reduction semantics.
  - glob: "src/flow_factory/contracts/reward_overlap.py"
    profile: R4
    facets: [overlap, feedback]
    reason: Reward overlap contracts define streaming optimization capability.
  - glob: "src/flow_factory/contracts/sampler.py"
    profile: R4
    facets: [sampler, distributed]
    reason: Sampler contracts define cross-rank geometry.
  - glob: "src/flow_factory/rewards/reward_processor.py"
    profile: R4
    facets: [feedback, overlap]
    reason: RewardProcessor is shared reward dispatch infrastructure.
  - glob: "src/flow_factory/rewards/tile_plan.py"
    profile: R4
    facets: [overlap, sampler]
    reason: Tile planning controls streamed optimizer work units.
  - glob: "src/flow_factory/advantage/advantage_processor.py"
    profile: R4
    facets: [feedback, distributed]
    reason: Advantage communication is shared across reward-driven algorithms.
  - glob: "src/flow_factory/data_utils/sampler.py"
    profile: R4
    facets: [sampler, distributed]
    reason: Shared sampler geometry affects every generated acquisition.
  - glob: "src/flow_factory/data_utils/multi_source.py"
    profile: R4
    facets: [sampler, data_schema]
    reason: Multi-source scheduling must preserve child sampler boundaries.
  - glob: "src/flow_factory/acceleration/abc.py"
    profile: R4
    facets: [acceleration, parity, execution]
    reason: The acceleration base class defines the shared plugin lifecycle.
  - glob: "src/flow_factory/acceleration/validator.py"
    profile: R4
    facets: [acceleration, parity, execution]
    reason: Acceleration validation gates every trainer paradigm and plugin composition.
  - glob: "src/flow_factory/loading/**"
    profile: R4
    facets: [loading, distributed]
    reason: Loading compiles logical components into distributed ownership roots.
  - glob: "src/flow_factory/models/abc.py"
    profile: R4
    facets: [model_runtime, parity]
    reason: BaseAdapter changes affect every model family.
  - glob: "src/flow_factory/models/runtime/**"
    profile: R4
    facets: [model_runtime, loading]
    reason: Component runtime changes affect lifecycle and ownership.
  - glob: "src/flow_factory/models/trajectory_bridge/**"
    profile: R4
    facets: [trajectory, parity]
    reason: Shared trajectory bridges connect rollout and optimization.
  - glob: "src/flow_factory/optimizer/**"
    profile: R4
    facets: [optimizer, distributed]
    reason: Optimizer ownership is shared prepared infrastructure.

content_rules:
  - glob: "src/flow_factory/trainers/**/*.py"
    pattern: "(class [A-Za-z0-9_]+Trainer\\((?!BaseTrainer\\b)[A-Za-z0-9_]+Trainer\\)|def (sampling_context|_initialize_snapshots|_after_acquisition_cycle|compute_advantages)\\b)"
    profile: R2
    facets: [objective, runtime_state]
    reason: The algorithm composes inherited behavior, snapshots, or custom feedback semantics.
  - glob: "src/flow_factory/trainers/**/*.py"
    pattern: "def (_run_training_step|generate_samples|sample_batch|_algorithm_runtime_child_names|runtime_execution_identity_payload|_role_update_plan|_declare_model_variants|_prepare_reward_optimization_overlap|_optimize_reward_overlap_tile|_finalize_reward_optimization_overlap)\\b"
    profile: R3
    facets: [execution, runtime_state]
    reason: The diff changes an advanced trainer lifecycle hook.
  - glob: "src/flow_factory/**/*.py"
    pattern: "(all_reduce|all_gather|accelerator\\.gather|torch\\.distributed)"
    profile: R3
    facets: [distributed]
    reason: The diff contains explicit distributed communication.
  - glob: "src/flow_factory/models/**/*.py"
    pattern: "(build_output_state_codec|build_condition_state_preparer|enable_gradient_checkpointing|_gradient_checkpointing_units)"
    profile: R2
    facets: [model_adapter, model_runtime]
    reason: The adapter adds an existing codec, condition, or checkpoint specialization.
  - glob: "src/flow_factory/models/**/*.py"
    pattern: "(build_component_runtime|trajectory_component_order|_validate_encoded_output_geometry|supports_fsdp2|pack_composition)"
    profile: R3
    facets: [model_runtime, trajectory]
    reason: The adapter changes advanced runtime, trajectory, offline, or backend capability.
  - glob: "src/flow_factory/rewards/**/*.py"
    pattern: "(GroupwiseRewardModel|GlobalwiseRewardModel|source_id|unique_id)"
    profile: R2
    facets: [reward, feedback]
    reason: Groupwise or remote reward behavior needs processor-level evidence.
  - glob: "src/flow_factory/rewards/**/*.py"
    pattern: "(asyncio|AsyncOpenAI|async def|def (close|__aenter__|__aexit__)\\b)"
    profile: R3
    facets: [reward, feedback, runtime_state]
    reason: A new asynchronous or persistent reward lifecycle needs strict cleanup and failure evidence.
  - glob: "src/flow_factory/acceleration/**/*.py"
    pattern: "(stage\\s*=\\s*[\"']rollout[\"']|safety\\s*=\\s*[\"']lossy[\"']|def rollout_context\\b|torch\\.compile|cache|offload)"
    profile: R3
    facets: [acceleration, parity, runtime_state]
    reason: Rollout-scoped, lossy, cached, compiled, or offloaded acceleration changes runtime state or numerical parity.

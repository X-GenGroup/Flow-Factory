name: Quality and CPU contracts

on:
  workflow_dispatch:
    inputs:
      bundle:
        description: Bounded JSON evidence bundle for this branch HEAD
        required: false
        type: string
      acceptance:
        description: Optional bounded reviewed-incremental manifest; dispatched separately from large bundles
        required: false
        type: string
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'workflow_dispatch'
    # Evidence-only dispatches must not publish skipped required-check names.
    name: ${{ github.event_name == 'workflow_dispatch' && 'evidence-only-quality' || 'quality' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/quality.txt
      - name: Prepare quality tools and warm hook environments
        run: |
          make quality-env
          make quality-warm
      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/quality.py pr-title
      - name: Check the tested commit against its comparison base
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REF: ${{ github.sha }}
        run: |
          python3 scripts/quality.py check --base "$BASE_REF" --head "$HEAD_REF"

  cpu-contracts:
    if: github.event_name != 'workflow_dispatch'
    # Keep this required-check name stable. It now gates all selected evidence.
    name: ${{ github.event_name == 'workflow_dispatch' && 'evidence-only-cpu' || 'cpu-contracts' }}
    runs-on: ubuntu-24.04
    # A batched main push can revalidate several original PR reports.
    timeout-minutes: 30
    env:
      BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/quality.txt
      - name: Prepare tools without the training stack
        run: make quality-env
      - name: Generate the exact-head validation plan
        run: >-
          python3 scripts/quality.py validation generate
          --base "$BASE_REF" --head "$HEAD_REF"
          --output .scratch/validation/plan.json
      - name: Run selected CPU assertions
        continue-on-error: true
        run: >-
          python3 scripts/quality.py validation run-cpu
          --plan .scratch/validation/plan.json
          --output .scratch/validation/cpu.json
          --logs .scratch/validation/logs
      - name: Read matching externally executed evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/quality.py validation fetch-evidence
          --plan .scratch/validation/plan.json
          --repository "$GITHUB_REPOSITORY"
          --output .scratch/validation/bundle.json
      - name: Read an explicitly dispatched incremental review
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/quality.py acceptance fetch
          --plan .scratch/validation/plan.json --repository "$GITHUB_REPOSITORY"
          --output .scratch/validation/acceptance.json
      - name: Report qualification and any explicit incremental acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_EVENT: ${{ github.event_name }}
          VALIDATION_REF: ${{ github.ref }}
        run: |
          evidence_args=()
          if test -f .scratch/validation/bundle.json; then
            evidence_args+=(--bundle .scratch/validation/bundle.json)
          fi
          if test -f .scratch/validation/acceptance.json; then
            evidence_args+=(--acceptance .scratch/validation/acceptance.json --repository "$GITHUB_REPOSITORY")
          fi
          if [[ "$VALIDATION_EVENT" == push && "$VALIDATION_REF" == refs/heads/main ]]; then
            evidence_args+=(--merged-repository "$GITHUB_REPOSITORY")
          fi
          python3 scripts/quality.py validation report \
            --plan .scratch/validation/plan.json \
            --results .scratch/validation/cpu.json \
            --expected-commit "$HEAD_REF" \
            --output .scratch/validation/report.json "${evidence_args[@]}"
      - name: Preserve the plan, results and assertion logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: validation-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: .scratch/validation/
          include-hidden-files: true
          if-no-files-found: ignore

  record-evidence:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/quality.txt
      - run: make quality-env
      - name: Require evidence or an explicit incremental review
        env:
          BUNDLE: ${{ inputs.bundle }}
          ACCEPTANCE: ${{ inputs.acceptance }}
        run: python3 -c 'import os; assert os.environ["BUNDLE"] or os.environ["ACCEPTANCE"], "No evidence or review supplied"'
      - name: Verify source, canonical plan, observations and log contents
        if: inputs.bundle != ''
        id: verify
        env:
          EVIDENCE_BUNDLE: ${{ inputs.bundle }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          raw = os.environ['EVIDENCE_BUNDLE']
          if len(raw.encode()) > 60000:
              raise SystemExit('Evidence bundle exceeds 60 KB')
          bundle = json.loads(raw)
          if bundle['tested_commit'] != os.environ['GITHUB_SHA']:
              raise SystemExit('Dispatch branch HEAD differs from the tested commit')
          folder = Path('.scratch/recorded-evidence')
          folder.mkdir(parents=True, exist_ok=True)
          path = folder / 'bundle.json'
          path.write_text(raw)
          plan = folder / 'plan.json'
          command = ['python3', 'scripts/quality.py', 'validation']
          subprocess.run(command + ['generate', '--base', bundle['base_commit'],
                          '--head', os.environ['GITHUB_SHA'], '--output', str(plan)], check=True)
          name = subprocess.check_output(command + ['import-bundle', '--plan', str(plan),
                          '--bundle', str(path)], text=True).strip().splitlines()[-1]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('artifact_name=' + name + '\n')
          PY
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: inputs.bundle != ''
        with:
          name: ${{ steps.verify.outputs.artifact_name }}
          path: .scratch/recorded-evidence/bundle.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Verify the exact source review and historical baseline
        if: inputs.acceptance != ''
        id: review
        env:
          ACCEPTANCE_MANIFEST: ${{ inputs.acceptance }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYREVIEW'
          import json
          import os
          import subprocess
          from pathlib import Path
          raw = os.environ['ACCEPTANCE_MANIFEST']
          if len(raw.encode()) > 60000:
              raise SystemExit('Acceptance manifest exceeds 60 KB')
          manifest = json.loads(raw)
          if manifest['tested_commit'] != os.environ['GITHUB_SHA']:
              raise SystemExit('Dispatch branch HEAD differs from the reviewed commit')
          folder = Path('.scratch/recorded-acceptance')
          folder.mkdir(parents=True, exist_ok=True)
          path = folder / 'acceptance.json'
          path.write_text(raw)
          plan = folder / 'plan.json'
          subprocess.run(['python3', 'scripts/quality.py', 'validation', 'generate',
                          '--base', manifest['base_commit'], '--head', os.environ['GITHUB_SHA'],
                          '--output', str(plan)], check=True)
          name = subprocess.check_output(['python3', 'scripts/quality.py', 'acceptance', 'record',
                          '--plan', str(plan), '--repository', os.environ['GITHUB_REPOSITORY'],
                          '--acceptance', str(path)], text=True).strip().splitlines()[-1]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('artifact_name=' + name + '\n')
          PYREVIEW
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: inputs.acceptance != ''
        with:
          name: ${{ steps.review.outputs.artifact_name }}
          path: .scratch/recorded-acceptance/acceptance.json
          include-hidden-files: true
          if-no-files-found: error

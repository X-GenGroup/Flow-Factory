# Executable proof cases; cost_seconds is a scheduling estimate, not a timeout or benchmark.
schema_version: 1
cases:
- id: harness-contracts
  covers:
  - harness.contracts
  facets:
  - harness
  owners:
  - scripts/*
  - .agents/harness/*
  command:
  - python3
  - scripts/quality.py
  - cpu
  fixture: Dependency-light Git, scope, evidence and hook contract regressions in the isolated quality environment.
  fixture_kind: synthetic
  qa: Q0
  backend: cpu
  topology:
    nodes: 1
    ranks_per_node: 1
    dp_replicate: 1
    dp_shard: 1
    tp: 1
    cp: 1
    ep: 1
  oracle:
    kind: assertions
    description: Dependency-light Git, scope, evidence and hook contract regressions in the isolated quality
      environment.
    reward: none
  artifacts:
  - scripts/quality.py
  - scripts/agent_scope.py
  - scripts/validate_validation_plan.py
  - requirements/quality.txt
  - tests/docs/test_agent_harness.py
  - tests/docs/test_docstring_hygiene.py
  - tests/tools/test_quality.py
  - tests/tools/test_repository_consistency.py
  - tests/tools/test_registry_access.py
  - tests/scripts/test_agent_scope.py
  - tests/scripts/test_validate_validation_plan.py
  - tests/scripts/test_validation_catalog.py
  - tests/scripts/test_validate_gpu_campaign.py
  cost_seconds: 45
  resources:
    gpus: 0
    packages:
    - pytest
    environment:
      OMP_NUM_THREADS: '1'
    model_paths: []

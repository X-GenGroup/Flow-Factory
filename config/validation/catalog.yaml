  - scheduler.replay.coupled
  facets:
  - overlap
  - model_runtime
  - objective
  - feedback
  - reward
  - distributed
  - runtime_state
  - checkpoint
  - parity
  owners: *replay_id001
  command:
  - python3
  - -m
  - pytest
  - -q
  - tests/distributed/test_replay_selection.py
  fixture: Native FLUX DPPO LoRA FSDP2 on two ranks; three noisy transitions and two selected replay positions
    in reverse order.
  fixture_kind: model_structure
  qa: Q2
  backend: fsdp2
  topology:
    nodes: 1
    ranks_per_node: 2
    dp_replicate: 1
    dp_shard: 2
    tp: 1
    cp: 1
    ep: 1
  oracle:
    kind: numerical
    reward: varying
    description: Every selected transition replays exactly before mutation; independent DPPO derivatives,
      group/GAS membership, optimizer/EMA updates, pending rewards, exact checkpoint load and ordered
      continuation. Exploration has three noisy steps while optimization consumes only the configured
      two.
  artifacts:
  - tests/distributed/attention_precision_reference.py
  - tests/distributed/conftest.py
  - tests/distributed/context_parallel_overlap_runner.py
  - tests/distributed/coupled_objective_reference.py
  - tests/distributed/coupled_observations.py
  - tests/distributed/flux_coupled_fixture.py
  - tests/distributed/flux_sft_fixture.py
  - tests/distributed/native_observation_utils.py
  - tests/distributed/online_optimizer_observations.py
  - tests/distributed/test_context_parallel_state.py
  - tests/distributed/test_context_parallel_training.py
  - tests/distributed/test_model_preparation.py
  - tests/distributed/wan_eval_reward.py
  - tests/distributed/test_replay_selection.py
  - tests/distributed/flux_replay_selection_fixture.py
  cost_seconds: 90
  resources:
    gpus: 2
    packages:
    - pytest
    - torch
    - accelerate
    - diffusers
    - transformers
    - peft
    - numpy
    - tokenizers
    - Pillow
    environment:
      OMP_NUM_THREADS: '1'
      PYTHONFAULTHANDLER: '1'
      TOKENIZERS_PARALLELISM: 'false'
    model_paths: []
- id: logger-contracts
  covers:
  - logging.contracts
  facets:
  - runtime_state
  - feedback
  owners:
  - src/flow_factory/logger/**
  - src/flow_factory/hparams/log_args.py
  command:
  - python3
  - -m
  - pytest
  - -q
  - -W
  - error::pytest.PytestUnraisableExceptionWarning
  - tests/logger
  fixture: Recording backend with a gated converter, stub W&B/SwanLab/TensorBoard modules and synthetic moving clips encoded by the real GIF/MP4 writers.
  fixture_kind: synthetic
  qa: Q0
  backend: cpu
  topology:
    nodes: 1
    ranks_per_node: 1
    dp_replicate: 1
    dp_shard: 1
    tp: 1
    cp: 1
    ep: 1
  oracle:
    kind: assertions
    reward: none
    description: FIFO step order without blocking the caller, owned media copies, bounded media backlog with kept scalars,
      writer errors raised on the caller, drain/discard shutdown, per-backend containers and budgets, measured
      frame-rate-first fitting that keeps duration, and skipped videos that cannot meet their floors.
  artifacts:
  - tests/logger/test_async_logging.py
  - tests/logger/test_tensorboard_resize.py
  cost_seconds: 20
  resources:
    gpus: 0
    packages:
    - pytest
    - torch
    - numpy
    - Pillow
    - imageio
    - av
    environment:
      OMP_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: '-1'
    model_paths: []

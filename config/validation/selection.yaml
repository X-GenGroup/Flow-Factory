# Explicit coverage policy. Unknown source owners remain review obligations.
schema_version: 1
static_paths:
  - '*.md'
  - '**/*.md'
  - LICENSE*
  - .gitignore
  - .dockerignore
  - assets/**
owners:
  - paths: [src/flow_factory/trainers/common/runtime_identity.py]
    symbols: [_evaluation_loader_schema, _loader_schema, _loader_length]
    requires: [evaluation.contracts]
    reason: Empty evaluation loaders retain exact data identity without weakening nonempty training or finite geometry.
  - paths: [src/flow_factory/data_utils/dataset.py]
    symbols: [GeneralDataset._preprocess_dataset, GeneralDataset._write_empty_part]
    requires: [evaluation.contracts]
    reason: Empty evaluation sources must preserve their source schema through preprocessing and cache reload;
      nonempty and rank-local empty partitions retain existing loader contracts.
  - paths: [tests/data_utils/test_preprocess_empty_shards.py]
    requires: [evaluation.contracts]
    reason: Whole-source and rank-partition emptiness have distinct preprocessing schema ownership.
  - paths:
    - src/flow_factory/utils/group_coordinator.py
    - src/flow_factory/trainers/multirole/backend.py
    - tests/distributed/test_logical_subgroups.py
    - tests/distributed/test_context_parallel_subgroups.py
    requires:
    - geometry.subgroups.tp2.cp1.replicate1
    - geometry.subgroups.tp1.cp2.replicate1
    - geometry.subgroups.tp2.cp2.replicate1
    - geometry.subgroups.tp2.cp1.replicate2
    - geometry.subgroups.nccl.tp2.cp1.dp4
    - geometry.subgroups.nccl.tp1.cp2.dp4
    - geometry.subgroups.native.tp1.cp2.dp4
    - geometry.subgroups.native.tp2.cp2.dp2
    reason: Combine full TP2/CP2/DP4 Gloo membership with real NCCL isolation of two R2 subgroups at
      each independent model-peer axis, native CP2/DP4 multiple-subgroup GRPO, and native TP2/CP2/DP2
      training, replay and continuation. DP2/R2 alone does not prove multiple nontrivial subgroups;
      this composition does not qualify a sixteen-GPU TP2/CP2/DP4 training execution.
  - paths: [examples/grpo/lora/wan21/t2v_tp_cp.yaml]
    requires: [evaluation.contracts, evaluation.native.tp2]
    reason: The documented evaluation example must parse against its public capability and match native TP+CP coverage.
  - paths:
    - src/flow_factory/trainers/common/evaluation.py
    - tests/trainers/test_evaluation_geometry.py
    - tests/trainers/test_evaluation_media.py
    - tests/distributed/test_evaluation_parallel.py
    - tests/distributed/test_context_parallel_evaluation.py
    - tests/distributed/wan_eval_reward.py
    requires:
    - evaluation.contracts
    - evaluation.geometry.tp1.cp1
    - evaluation.geometry.tp2.cp1
    - evaluation.geometry.tp1.cp2
    - evaluation.geometry.tp2.cp2
    - evaluation.native.tp1
    - evaluation.native.tp2
    - evaluation.cp1.sft
    - evaluation.cp1.grpo
    reason: Evaluation owns logical rows, bounded DP statistics and EMA generation before subsequent training;
      qualify every admitted algorithm.
  - paths:
    - src/flow_factory/trainers/abc.py
    symbols:
    - BaseTrainer.evaluate
    - BaseTrainer._evaluate_dataset
    requires:
    - evaluation.contracts
    - evaluation.native.tp1
    - evaluation.native.tp2
    - evaluation.cp1.sft
    - evaluation.cp1.grpo
    reason: Shared evaluation changes must preserve dataset-driven and online training with explicit model-peer
      ownership.
  - paths: [src/flow_factory/trainers/distillation/distillation_runtime.py,
            tests/trainers/test_distillation_metrics.py, tests/trainers/test_tdm.py]
    requires: [lifecycle.tdm, feedback.reconstruction]
    reason: Shared role-phase backward must preserve CP1 DMD2/TDM/TDM-R1 cadence, gradients and evaluation.
  - paths: [src/flow_factory/acceleration/attention_backend.py]
    requires: [preparation.contracts, parallel.tp_cp_sft, algorithm.cp.dmd2.tp1, algorithm.cp.dmd2.tp2]
    reason: Shared backend selection must reach each physical role before CP hooks and preserve canonical training.
  - paths: [tests/rewards/test_reward_tensor_parallel_agreement.py]
    requires: [feedback.reconstruction, feedback.tp_agreement, feedback.cp_agreement.tp1, feedback.cp_agreement.tp2]
    reason: Model-peer single-owner reward assertions must retain full, tail, group and asynchronous semantics.
  - paths: [src/flow_factory/models/compute_precision.py, src/flow_factory/hparams/model_args.py,
            tests/models/test_compute_precision.py]
    requires: [precision.compute, precision.wan_sft]
    reason: Model-declared operation precision must preserve autocast/autograd, variant ownership and complete Wan training updates.
  - paths: [.agents/**, .cursor/**, .claude/**, AGENTS.md, CLAUDE.md,
            scripts/agent_*.py, scripts/*validation*.py, scripts/validate_*.py,
            scripts/check_*.py, scripts/audit_docstrings.py, scripts/query_fix_patterns.py,
            scripts/repo_checks/**, scripts/quality.py, requirements/quality.txt,
            requirements/actionlint.json, config/validation/**, .github/workflows/**,
            .pre-commit-config.yaml, Makefile, tests/scripts/**, tests/tools/**, tests/docs/**]
    requires: [harness.contracts]
    reason: Keep executable harness policy, local tooling, and CI behavior consistent.
  - paths: [src/flow_factory/utils/dist.py, src/flow_factory/hparams/parallelism_args.py]
    requires: [geometry.logical_samples]
    reason: Prove group membership, logical sample identity, and batch geometry.
  - paths: [src/flow_factory/utils/dist.py, src/flow_factory/utils/group_coordinator.py]
    requires: [feedback.reconstruction]
    reason: Collective scope changes must preserve feedback payload packing, reconstruction, and singleton bypass.
  - paths: [src/flow_factory/trainers/common/dpo_objective.py]
    requires: [objective.dpo]
    reason: Compare values and gradients against the independent DPO objective oracle.
  - paths: [src/flow_factory/trainers/rl/dpo.py, src/flow_factory/trainers/offline/offline_dpo.py]
    requires: [objective.dpo, execution.contracts]
    reason: Preserve DPO mathematics and acquisition-contract routing.
  - paths: [src/flow_factory/models/tensor_parallel.py]
    requires: [parallel.tp_parity, parallel.sp_parity, geometry.logical_samples,
               distributed.collective_order, feedback.tp_agreement]
    reason: Shared tensor layouts affect every adapter, logical group, and collective lifecycle.
  - paths: [src/flow_factory/contracts/execution.py, src/flow_factory/trainers/execution.py]
    requires: [execution.contracts]
    reason: Preserve online/offline acquisition and feedback execution boundaries.
  - paths: [src/flow_factory/trainers/role_optimization.py, src/flow_factory/trainers/multirole/**,
            src/flow_factory/optimizer/**]
    requires: [roles.isolation, roles.isolation.ddp, roles.isolation.zero2, roles.isolation.fsdp2,
               checkpoint.roundtrip]
    reason: Prove active updates, inactive optimizer-state isolation, and state round trips on affected backends.
  - paths: [src/flow_factory/loading/**, src/flow_factory/models/runtime/**,
            src/flow_factory/trainers/loader.py]
    requires: [roles.isolation, roles.isolation.ddp, roles.isolation.zero2, roles.isolation.fsdp2,
               checkpoint.roundtrip, parallel.tp_parity]
    reason: Shared preparation owns every backend's parameter and optimizer identities.
  - paths: [src/flow_factory/rewards/reward_processor.py, src/flow_factory/rewards/tile_plan.py,
            src/flow_factory/contracts/reward_overlap.py]
    requires: [feedback.reconstruction, overlap.lifecycle, reward.worker_device, feedback.tp_agreement]
    reason: Verify reconstruction, asynchronous lifecycle, worker devices, and TP peer agreement.
  - paths: [src/flow_factory/trainers/abc.py]
    requires: [execution.contracts, overlap.lifecycle, checkpoint.roundtrip, roles.isolation]
    reason: The shared trainer owns acquisition, optimization, feedback cleanup, and resume.
  - paths: [src/flow_factory/trainers/abc.py]
    symbols: ['BaseTrainer.*runtime*', 'BaseTrainer.*checkpoint*', 'BaseTrainer.*training_state*']
    requires: [runtime.identity, checkpoint.contracts]
    reason: Changes to runtime persistence must exercise manifest validation and resume identity.
  - paths: [src/flow_factory/trainers/abc.py]
    symbols: ['BaseTrainer.*reward*overlap*', BaseTrainer.generate_samples]
    requires: [feedback.reconstruction, feedback.tp_agreement, distributed.collective_order,
               geometry.logical_samples]
    reason: Acquisition and tile scheduling must preserve logical samples, peer readiness, and collective cleanup.
  - paths: [src/flow_factory/trainers/common/runtime_identity.py]
    requires: [geometry.logical_samples, runtime.identity, checkpoint.contracts]
    reason: Geometry identity changes must preserve checkpoint compatibility or reject it explicitly.
  - paths:
    - src/flow_factory/contracts/topology.py
    - src/flow_factory/utils/dist.py
    - src/flow_factory/utils/group_coordinator.py
    requires:
    - geometry.logical_samples
    - geometry.topology
    - geometry.scope_contracts
    - geometry.scopes.dp_cp_tp
    - geometry.scopes.cp_tp
    - geometry.scopes.hybrid_dp_tp
    - geometry.nccl.dp
    - geometry.nccl.tp
    - geometry.nccl.cp
    reason: Preserve authoritative physical mesh dimensions, logical samples and real CPU/NCCL scopes, including
      model-peer-only groups.
  - paths:
    - src/flow_factory/hparams/args.py
    symbols:
    - Arguments._validate_parallelism_geometry
    - Arguments.data_parallel_world_size
    requires:
    - geometry.logical_samples
    - geometry.topology
    - geometry.scope_contracts
    reason: Changed configuration geometry methods must validate the complete declared mesh before runtime allocation.
  - paths: [src/flow_factory/hparams/parallelism_args.py]
    requires: [geometry.topology]
    reason: Declared mesh dimensions must retain their typed validation and public capability gates.
  - paths:
    - src/flow_factory/trainers/common/model_preparation.py
    requires:
    - preparation.contracts
    - preparation.tp_hooks
    - preparation.variant_tp
    - preparation.ddp
    - preparation.fsdp2
    - preparation.zero2
    - parallel.tp_parity
    - parallel.sp_parity
    reason: The preparation owner mutates all model routes and backend identities; cover real shared/full
      variants and each supported backend before broadening model parity.
  - paths:
    - src/flow_factory/utils/tensor_state.py
    - src/flow_factory/ema/ema.py
    - src/flow_factory/models/variants.py
    - src/flow_factory/trainers/common/runtime_state.py
    requires:
    - parameter_state.contracts
    - parameter_state.fsdp2
    - parameter_state.fsdp2-tp
    reason: Auxiliary state ownership must preserve legacy data and fixed-topology FSDP2/TP next-update
      equivalence without full-tensor gathers.
  - paths:
    - src/flow_factory/rewards/reward_processor.py
    - src/flow_factory/hparams/reward_args.py
    requires:
    - reward.lifecycle
    reason: Request limits and worker lifecycle must preserve old default serialization, feedback errors
      and resource ownership.
  - paths:
    - src/flow_factory/trainers/abc.py
    requires:
    - lifecycle.tile_stream
    reason: The shared trainer owns full-acquisition feedback and terminal resource cleanup.
  - paths:
    - src/flow_factory/trainers/distillation/tdm_r1.py
    requires:
    - lifecycle.tdm
    reason: The algorithm owns its partial overlap context and role/objective behavior.
  - paths:
    - src/flow_factory/models/context_parallel.py
    - src/flow_factory/trainers/common/context_parallel.py
    - src/flow_factory/trainers/common/model_preparation.py
    - src/flow_factory/hparams/parallelism_args.py
    - src/flow_factory/models/wan/wan2_t2v.py
    - src/flow_factory/trainers/offline/sft.py
    - examples/sft/lora/wan2_t2v/wan21_cp.yaml
    requires: [parallel.cp_contracts, preparation.cp_probe, parallel.cp_sft]
    reason: Public CP must prove its fail-fast capability, output-gradient contract and complete SFT update path.
  - paths:
    - src/flow_factory/models/abc.py
    - tests/models/test_all_model_loaders.py
    requires: [parallel.cp_contracts, adapters.loader_contracts]
    reason: Adapter capability defaults must remain opt-in and CP=1 must preserve existing model loaders.
  - paths:
    - src/flow_factory/loading/backend.py
    - src/flow_factory/loading/coordinator.py
    - src/flow_factory/trainers/common/model_preparation.py
    requires: [preparation.initial_state]
    reason: Replicated FSDP2 roots must agree before any sharding without changing RNG or parameter identity.

  - paths:
    - src/flow_factory/models/context_parallel.py
    - src/flow_factory/models/wan/wan2_t2v.py
    - src/flow_factory/trainers/common/context_parallel.py
    - src/flow_factory/trainers/common/model_preparation.py
    - tests/distributed/test_context_parallel_probe.py
    - tests/distributed/test_context_parallel_training.py
    - tests/distributed/wan_sft_fixture.py
    - examples/sft/lora/wan2_t2v/wan21_tp_cp.yaml
    requires: [parallel.cp_contracts, preparation.tp_cp_probe, parallel.tp_cp_sft]
    reason: TP/SP and CP must preserve independent peers, canonical token order and every gradient/update through complete SFT.

  - paths:
    - src/flow_factory/models/tensor_parallel.py
    - tests/distributed/test_across_head_norm_pairing.py
    requires: [parallel.norm_precision]
    reason: Sharded normalization must preserve low-precision derivative cancellation, pairing collectives and activation cleanup.

  - paths: [src/flow_factory/ema/ema.py, src/flow_factory/models/variants.py,
            src/flow_factory/models/abc.py, src/flow_factory/trainers/common/model_preparation.py,
            tests/distributed/test_model_preparation.py]
    requires: [checkpoint.snapshot_forward.tp1, checkpoint.snapshot_forward.tp2]
    reason: Snapshot tensors alone do not prove installed weights; FSDP2 retained and prefetched views must refresh at swaps without changing pending policy gradients.

  - paths: [src/flow_factory/models/abc.py]
    symbols: [BaseAdapter._trained_component_uniform_dtype, BaseAdapter._mix_precision,
              BaseAdapter._apply_component_precision_policy, BaseAdapter._apply_trainable_dtype_to_variants,
              BaseAdapter.align_component_variant_dtypes]
    requires: [precision.original_contracts, precision.variant_original]
    reason: Initial, lazy, late and restored roles must agree on original storage before TP metadata exists while retaining configured mixed-precision compute.

  - paths:
    - src/flow_factory/rewards/reward_processor.py
    - src/flow_factory/utils/dist.py
    requires:
    - feedback.cp_agreement.tp1
    - feedback.cp_agreement.tp2
    reason: Logical reward ownership must span all TP x CP peers while preserving distinct DP groups, asynchronous
      completion and RNG.
  - paths:
    - src/flow_factory/trainers/common/context_parallel.py
    - src/flow_factory/trainers/common/runtime_identity.py
    - src/flow_factory/trainers/common/model_preparation.py
    - src/flow_factory/trainers/abc.py
    - tests/distributed/test_context_parallel_state.py
    requires:
    - checkpoint.cp_state.tp1
    - checkpoint.cp_state.tp2
    reason: Enabled CP state and loss semantics require exact loaded state and bounded next-update continuation,
      including EMA and TP composition.
  - paths:
    - src/flow_factory/trainers/common/context_parallel.py
    - src/flow_factory/trainers/common/model_preparation.py
    - src/flow_factory/trainers/rl/grpo.py
    - src/flow_factory/trainers/distillation/dmd2.py
    - src/flow_factory/trainers/distillation/distillation_runtime.py
    - tests/distributed/test_context_parallel_online.py
    - tests/distributed/wan_online_reward.py
    - tests/distributed/online_observations.py
    - tests/distributed/online_update_reference.py
    - tests/distributed/dmd2_objective_reference.py
    - tests/distributed/test_dmd2_objective_reference.py
    - tests/distributed/test_online_update_reference.py
    - examples/grpo/lora/wan21/t2v_tp_cp.yaml
    - examples/dmd2/lora/wan21/t2v_tp_cp.yaml
    requires:
    - algorithm.cp.grpo.tp1
    - algorithm.cp.grpo.tp2
    - algorithm.cp.dmd2.tp1
    - algorithm.cp.dmd2.tp2
    - algorithm.cp.numerical_reference
    reason: CP algorithm admission must prove actual reward and multi-role updates, exact on-policy replay
      and fixed-topology state continuation.

interactions:
  - facets: [roles, distributed]
    requires: [roles.isolation.ddp, roles.isolation.zero2, roles.isolation.fsdp2]
    reason: Shared role and distributed ownership changes require each affected backend, not the cheapest one.
  - facets: [model_runtime, distributed]
    requires: [parallel.fsdp2_tp_lora]
    reason: Preparation and layout changes must cover FSDP2 plus TP plus trainable adapters together.
  - facets: [overlap, distributed]
    requires: [feedback.tp_agreement, distributed.collective_order]
    reason: Streamed feedback must preserve peer agreement and collective cleanup.
  - facets: [runtime_state]
    requires: [checkpoint.roundtrip]
    reason: Persistent state changes need state round-trip evidence even inside one algorithm.
